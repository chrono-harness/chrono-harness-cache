name: Release chrono-cache
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release branch
        shell: bash
        run: |
          set -euo pipefail
          source_oid=$(git rev-parse HEAD)
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+[.][0-9]+[.][0-9]+$ ]]; then
            test "$source_oid" = "$(git rev-parse refs/remotes/origin/main)"
          elif [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+[.][0-9]+[.][0-9]+-[0-9A-Za-z.-]+$ ]]; then
            git merge-base --is-ancestor "$source_oid" refs/remotes/origin/dev
          else
            echo "Unsupported release tag: $GITHUB_REF_NAME" >&2
            exit 1
          fi
  build:
    needs: source
    strategy:
      matrix:
        include:
          - runner: macos-15
            platform: macos-aarch64
          - runner: ubuntu-24.04
            platform: linux-x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78
        with:
          version: 2026.11.12
          cache: false
          install_args: http:chrono-harness http:chrono-diagnostics
      - name: Build and exercise the release binary
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          CARGO_TARGET_DIR: ${{ runner.temp }}/target
        run: |
          set -euo pipefail
          cargo build --release --locked --manifest-path crates/cache/Cargo.toml
          binary="$CARGO_TARGET_DIR/release/chrono-cache"
          host="$RUNNER_TEMP/cache-host"
          mkdir -p "$host/.chrono-harness"
          cp .github/fixtures/cache-plan/*.json "$host/.chrono-harness/"
          cp crates/cache/Cargo.lock crates/cache/Cargo.toml "$host/"
          "$binary" plan --host-root "$host" --config .chrono-harness/cache.json --consumer build > "$host/plan.json"
          jq -e '.consumer == "build" and .consumer_operations.operations == ["build.cache"]
                 and (.caches.cargo.key | type == "string" and length > 0)' "$host/plan.json"
          code=0
          "$binary" plan --host-root "$host" --config .chrono-harness/cache.json --consumer unknown 2>"$host/error" || code=$?
          test "$code" = 2
          test -s "$host/error"
          cp crates/cache-tests/tests/fixtures/retention.json "$host/.chrono-harness/retention.json"
          jq --arg program "$(command -v uname)" '
            def probe($arg): {kind:"command",command:{program:$program,args:[$arg],env:{},timeout_seconds:10,output_limit_bytes:4096},inherit:[],result:"stdout"};
            .inputs.lock=probe("-s") | .inputs.manifest=probe("-m")
          ' .github/fixtures/cache-plan/cache.json > "$host/.chrono-harness/cache.json"
          printf '%s\n' '{"schema":"chrono-runtime-logging/v1","level":"debug","directory":".chrono-harness/logs/","max_bytes":1048576,"max_files":2,"keep_seconds":3600,"stderr":false}' > "$host/.chrono-harness/logging.json"
          output=.chrono-harness/state/cache/release/plan.json
          for pass in first replay; do
            "$binary" plan --host-root "$host" --config .chrono-harness/cache.json --consumer build --plan-output "$output" > "$host/$pass.json"
          done
          cmp "$host/first.json" "$host/replay.json"
          test "$(jq '.inputs | length' "$host/first.json")" = 2
          for input in lock manifest; do
            original=$(jq -er --arg input "$input" '.inputs[$input].original.path' "$host/first.json")
            expected=$(jq -er --arg input "$input" '.inputs[$input].original.sha256' "$host/first.json")
            jq -e '.exit_code == 0 and .owned_work_joined and .child_pid > 0' "$host/$original"
            jq -e --slurpfile receipt "$host/$original" '.child_pid == $receipt[0].child_pid and .sha256 == $receipt[0].sha256' "$host/${original%/*}/launch.json"
            printf '%s  %s\n' "$expected" "$host/$original" | shasum -a 256 -c -
          done
          jq -es 'any(.[]; .producer == "chrono-cache" and .event == "cache.plan.prepared")' "$host"/.chrono-harness/logs/*.jsonl
          mkdir "$RUNNER_TEMP/dist"
          cp "$CARGO_TARGET_DIR/release/chrono-cache" "$RUNNER_TEMP/dist/chrono-cache-$PLATFORM"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.platform }}
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error
          retention-days: 1
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093b
        with:
          path: ${{ runner.temp }}/dist
          merge-multiple: true
      - name: Publish binaries and their checksums
        working-directory: ${{ runner.temp }}/dist
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          sha256sum chrono-cache-macos-aarch64 chrono-cache-linux-x86_64 > SHA256SUMS
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$GITHUB_REF_NAME" --generate-notes "${flags[@]}" \
            chrono-cache-macos-aarch64 chrono-cache-linux-x86_64 SHA256SUMS
