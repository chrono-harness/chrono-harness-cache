# chrono-ci: owned native cache action/v1
name: "check"
description: "Cargo checks restored inputs and runs the native tests and Verus proofs."
runs:
  using: composite
  steps:
      - name: Prepare registered caches
        id: chrono_cache_plan
        shell: bash
        run: |
          'mkdir' '-p' 'target/native-cargo'
          '.chrono-harness/bin/chrono-cache' plan --host-root . --config '.chrono-harness/cache.json' --consumer 'native-check' --plan-output '.chrono-harness/state/cache/native-check/plan.json' --github-output "$GITHUB_OUTPUT"
      - name: Restore registered cache cargo-download
        id: cache_0_restore
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: ${{ steps.chrono_cache_plan.outputs.cache_0_key }}
          path: ${{ steps.chrono_cache_plan.outputs.cache_0_paths }}
          restore-keys: ${{ steps.chrono_cache_plan.outputs.cache_0_restore }}
          fail-on-cache-miss: false
      - name: Restore registered cache cargo-target
        id: cache_1_restore
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: ${{ steps.chrono_cache_plan.outputs.cache_1_key }}
          path: ${{ steps.chrono_cache_plan.outputs.cache_1_paths }}
          restore-keys: ${{ steps.chrono_cache_plan.outputs.cache_1_restore }}
          fail-on-cache-miss: false
      - name: Recover failed cache restores
        if: ${{ steps.chrono_cache_plan.outputs.cache_recovery == 'discard-failed-host-restores' }}
        shell: bash
        env:
          CHRONO_CACHE_RESTORE_STEPS: ${{ toJSON(steps) }}
        run: |
          '.chrono-harness/bin/chrono-cache' recover --host-root . --config '.chrono-harness/cache.json' --plan '.chrono-harness/state/cache/native-check/plan.json' --steps-env CHRONO_CACHE_RESTORE_STEPS
      - name: Run registered native command
        id: chrono_cache_work
        shell: bash
        run: |
          './check.sh'
      - name: Seal producer cache contents
        id: chrono_cache_seal
        if: ${{ always() && !cancelled() && steps.chrono_cache_plan.outputs.cache_content_verification == 'producer-manifest/v1' }}
        shell: bash
        env:
          CHRONO_CACHE_PRODUCER_STEPS: ${{ toJSON(steps) }}
        run: |
          '.chrono-harness/bin/chrono-cache' seal --host-root . --config '.chrono-harness/cache.json' --plan '.chrono-harness/state/cache/native-check/plan.json' --steps-env CHRONO_CACHE_PRODUCER_STEPS --work 'chrono_cache_work' --save-caches '["cargo-download","cargo-target"]' --github-output "$GITHUB_OUTPUT"
      - name: Save registered cache cargo-download
        id: cache_0_save
        if: ${{ always() && !cancelled() && steps.chrono_cache_plan.outcome == 'success' && (steps.chrono_cache_work.outcome == 'success' || (steps.chrono_cache_plan.outputs.cache_0_save_on_failure == 'true' && steps.chrono_cache_work.outcome == 'failure')) && steps.cache_0_restore.outputs.cache-matched-key != steps.chrono_cache_plan.outputs.cache_0_key && (steps.chrono_cache_plan.outputs.cache_0_verification != 'producer-manifest/v1' || steps.chrono_cache_seal.outputs.cache_0_sealed == 'true') }}
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: ${{ steps.chrono_cache_plan.outputs.cache_0_key }}
          path: ${{ steps.chrono_cache_plan.outputs.cache_0_paths }}
      - name: Save registered cache cargo-target
        id: cache_1_save
        if: ${{ always() && !cancelled() && steps.chrono_cache_plan.outcome == 'success' && (steps.chrono_cache_work.outcome == 'success' || (steps.chrono_cache_plan.outputs.cache_1_save_on_failure == 'true' && steps.chrono_cache_work.outcome == 'failure')) && steps.cache_1_restore.outputs.cache-matched-key != steps.chrono_cache_plan.outputs.cache_1_key && (steps.chrono_cache_plan.outputs.cache_1_verification != 'producer-manifest/v1' || steps.chrono_cache_seal.outputs.cache_1_sealed == 'true') }}
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: ${{ steps.chrono_cache_plan.outputs.cache_1_key }}
          path: ${{ steps.chrono_cache_plan.outputs.cache_1_paths }}
