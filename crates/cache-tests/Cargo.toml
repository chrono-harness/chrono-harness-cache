[package]
name = "chrono-cache-tests"
version = "0.1.0"
edition = "2024"
publish = false
autotests = false

[dependencies]
hex = "0.4"
vstd = "=0.0.0-2026-11-22-0344"
chrono-cache = { path = "../cache" }

serde_json = "1"
sha2 = "0.11"
verus_builtin_macros = "=0.0.0-2026-11-22-0344"

[dev-dependencies]
serde_yaml = { package = "serde_yaml_ng", version = "0.10" }
toml = { version = "1.2", default-features = false, features = ["parse", "serde", "std"] }
libc = "0.2"
tempfile = "3"

[[bin]]
name = "chrono-cache-test-cli"
path = "../cache/src/main.rs"
test = false
bench = false

[[test]]
name = "keys"
path = "tests/keys.rs"

[[test]]
name = "custody"
path = "tests/custody.rs"

[[test]]
name = "verified_planner"
path = "tests/verified_planner.rs"

[[bin]]
name = "chrono-cache-test-probe"
path = "tests/support/probe.rs"
test = false
bench = false

# Keep the actual cache CLI and its test CLI on the same development profile.
[profile.dev]
opt-level = 1

[profile.dev.package.sha2]
opt-level = 3

[[bin]]
name = "chrono-cache-mock-owner"
path = "tests/support/mock_owner.rs"
test = false
bench = false

[[test]]
name = "deployed_host"
path = "../../.chrono-harness/ci/host_adapters.rs"

[[example]]
name = "release_observation"
path = "tests/release_observation.rs"
test = true
