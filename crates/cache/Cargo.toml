[package]
name = "chrono-cache"
version = "0.1.5"
edition = "2024"
publish = false
description = "Explicit cache input and artifact planning"

[lib]
test = false
doctest = false

[[bin]]
name = "chrono-cache"
path = "src/main.rs"
test = false
bench = false

[dependencies]
hex = "0.4"
digest-io = "0.1"
vstd = "=0.0.0-2026-04-20-1748"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
serde_jcs = "=0.4.0"
tracing = { version = "0.1", default-features = false, features = ["std"] }

tracing-tunnel = { version = "=0.1.0", default-features = false, features = ["sender"] }
serde_yaml_ng = "=0.10.0"
litrs = "=1.0.1"

[profile.dev]
opt-level = 1

[profile.dev.package.sha2]
opt-level = 3
